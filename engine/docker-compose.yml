services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kosmo
      POSTGRES_PASSWORD: kosmo
      POSTGRES_DB: kosmographica
    ports:
      # Host 5459 to coexist with other local/Docker Postgres instances.
      - "5459:5432"
    volumes:
      - kosmo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmo -d kosmographica"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kosmo_pgdata:
